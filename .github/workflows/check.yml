name: Check

# Packs theme/ with the real vyasa binary, so a theme that passes here
# installs on every Vyasa.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the vyasa binary
        run: |
          gh release download -R vyasa-cms/vyasa --pattern 'vyasa-*-x86_64-unknown-linux-gnu.tar.gz' -O vyasa.tar.gz
          mkdir -p .vyasa && tar -xzf vyasa.tar.gz --strip-components=1 -C .vyasa
          echo "$PWD/.vyasa" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.VYASA_READ_TOKEN || github.token }}
      - run: scripts/pack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: theme
          path: dist/*.vytheme
